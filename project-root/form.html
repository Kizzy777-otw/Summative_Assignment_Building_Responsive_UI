<!DOCTYPE html>
<html lang="en">

</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header>
    <h1>Student Finance Tracker</h1>

      </ul>

  <main id="main">
    <section>
      <h2>Add Record</h2>
      <form id="record-form">
        <label>Description <input type="text" id="desc"></label>
        <label>Amount <input type="number" step="0.01" id="amount"></label>
        <label>Category <input type="text" id="category"></label>
        <label>Date <input type="date" id="date"></label>
        <button type="submit">Add</button>
      </form>
      <div id="form-errors" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer>
