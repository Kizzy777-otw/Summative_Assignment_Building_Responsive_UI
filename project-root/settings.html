<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings - Finance Tracker</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <video autoplay muted loop class="video-bg">
    <source src="media/background2.mp4" type="video/mp4">
    Your browser does not support video.
  </video>

  <div class="content-wrapper">
    <a href="#main" class="skip-link">Skip</a>

    <header>
      <h1>Finance Tracker</h1>
      <nav>
        <a href="about.html">About</a>
        <a href="index.html">Dashboard</a>
        <a href="records.html">Records</a>
        <a href="form.html">Add</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>

    <main id="main">
      <h2>Settings</h2>
      <form id="settings-form">
        <select id="country">
          <option value="USA" data-rate="1" data-symbol="$">USA (USD)</option>
          <option value="Rwanda" data-rate="1200" data-symbol="RWF">Rwanda (RWF)</option>
          <option value="Europe" data-rate="0.9" data-symbol="€">Europe (EUR)</option>
        </select>
        <button>Save</button>
      </form>
      <div id="settings-msg" aria-live="polite"></div>
    </main>

    <footer>
      <p>&copy; 2026 Finance Tracker</p>
    </footer>
  </div>

  <script type="module" src="scripts/settings.js"></script>
</body>
</html>
